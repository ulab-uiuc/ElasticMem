<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 540" width="1600" height="540" role="img" aria-label="ElasticMem: memory corpus, elastic budget allocation, per-chunk latent budgets, latent injection, optimized in a reward loop">
  <defs>
    <linearGradient id="loop" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%"   stop-color="#3b8ef0"/>
      <stop offset="55%"  stop-color="#8fc0f7"/>
      <stop offset="100%" stop-color="#2f86f6"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eaf2fd"/>
    </linearGradient>
    <style>
      .nv   { stroke: #16243a; stroke-width: 7; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .nv-t { stroke: #16243a; stroke-width: 6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .pan  { fill: #f6f9fc; stroke: #16243a; stroke-width: 7; }
      .gray { fill: #c7d0da; }
      .trk  { fill: #e3e8ee; }
      .blu  { fill: #2f86f6; }
      .blul { fill: #bedcfb; }
      .ico  { fill: #ffffff; stroke: #16243a; stroke-width: 6; }
    </style>
  </defs>

  <!-- ─────────── 1. memory corpus: a stack of heterogeneous chunks ─────────── -->
  <rect x="62" y="62" width="300" height="400" rx="24" fill="url(#card)" stroke="#16243a" stroke-width="7"/>
  <rect x="40" y="40" width="300" height="400" rx="24" fill="url(#card)" stroke="#16243a" stroke-width="7"/>
  <rect x="14" y="14" width="300" height="400" rx="24" fill="#ffffff" stroke="#16243a" stroke-width="7"/>

  <!-- row 1: document -->
  <rect class="ico" x="46" y="52" width="58" height="58" rx="14"/>
  <path class="blu" d="M60 70h22v7H60zM60 84h30v7H60zM60 98h18v7H60z"/>
  <rect class="gray" x="130" y="62" width="150" height="11" rx="5.5"/>
  <rect class="gray" x="130" y="88" width="112" height="11" rx="5.5"/>

  <!-- row 2: image -->
  <rect class="ico" x="46" y="146" width="58" height="58" rx="14"/>
  <path d="M55 192l18-20 13 14 9-9 10 11" stroke="#2f86f6" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="88" cy="164" r="6" fill="#2f86f6"/>
  <rect class="gray" x="130" y="156" width="150" height="11" rx="5.5"/>
  <rect class="gray" x="130" y="182" width="112" height="11" rx="5.5"/>

  <!-- row 3: trajectory / video -->
  <rect class="ico" x="46" y="240" width="58" height="58" rx="14"/>
  <path class="blu" d="M66 254l26 15-26 15z"/>
  <rect class="gray" x="130" y="250" width="150" height="11" rx="5.5"/>
  <rect class="gray" x="130" y="276" width="112" height="11" rx="5.5"/>

  <!-- row 4: skill cards -->
  <circle cx="61" cy="349" r="13" fill="#2f86f6"/>
  <circle cx="92" cy="349" r="13" fill="#2f86f6"/>
  <circle cx="61" cy="380" r="13" fill="#2f86f6"/>
  <circle cx="92" cy="380" r="13" fill="#2f86f6"/>
  <rect class="gray" x="130" y="344" width="150" height="11" rx="5.5"/>
  <rect class="gray" x="130" y="370" width="112" height="11" rx="5.5"/>

  <!-- arrow 1 -->
  <path class="nv" d="M392 227h44"/>
  <path class="nv" d="M424 213l16 14-16 14"/>

  <!-- ─────────── 2. query-conditioned elastic allocation (sliders) ─────────── -->
  <rect class="pan" x="462" y="52" width="350" height="352" rx="28"/>
  <rect class="trk" x="500" y="122" width="274" height="16" rx="8"/>
  <rect class="blu" x="500" y="122" width="82"  height="16" rx="8"/>
  <circle cx="586" cy="130" r="27" fill="#dcebfc" stroke="#16243a" stroke-width="7"/>

  <rect class="trk" x="500" y="220" width="274" height="16" rx="8"/>
  <rect class="blu" x="500" y="220" width="186" height="16" rx="8"/>
  <circle cx="690" cy="228" r="27" fill="#2f86f6" stroke="#16243a" stroke-width="7"/>

  <rect class="trk" x="500" y="318" width="274" height="16" rx="8"/>
  <rect class="blu" x="500" y="318" width="98"  height="16" rx="8"/>
  <circle cx="602" cy="326" r="27" fill="#dcebfc" stroke="#16243a" stroke-width="7"/>

  <!-- arrow 2 -->
  <path class="nv" d="M836 227h44"/>
  <path class="nv" d="M868 213l16 14-16 14"/>

  <!-- ─────────── 3. per-chunk latent budgets (variable-length bars) ─────────── -->
  <rect class="pan" x="900" y="52" width="358" height="352" rx="28"/>
  <rect class="trk"  x="936" y="98"  width="286" height="42" rx="21"/>
  <rect class="blu"  x="936" y="98"  width="212" height="42" rx="21"/>
  <rect class="trk"  x="936" y="166" width="286" height="42" rx="21"/>
  <rect class="blul" x="936" y="166" width="114" height="42" rx="21"/>
  <rect class="trk"  x="936" y="234" width="286" height="42" rx="21"/>
  <rect class="blu"  x="936" y="234" width="196" height="42" rx="21"/>
  <rect class="trk"  x="936" y="302" width="286" height="42" rx="21"/>
  <rect class="blul" x="936" y="302" width="88"  height="42" rx="21"/>

  <!-- arrow 3 -->
  <path class="nv" d="M1282 227h44"/>
  <path class="nv" d="M1314 213l16 14-16 14"/>

  <!-- ─────────── 4. latent injection into the reasoner ─────────── -->
  <rect class="pan" x="1348" y="52" width="238" height="352" rx="28"/>
  <path class="nv-t" d="M1467 228V146M1467 228v82M1467 228h-78M1467 228h78"/>
  <circle cx="1467" cy="134" r="27" fill="#dcebfc" stroke="#16243a" stroke-width="7"/>
  <circle cx="1467" cy="322" r="27" fill="#dcebfc" stroke="#16243a" stroke-width="7"/>
  <circle cx="1377" cy="228" r="27" fill="#dcebfc" stroke="#16243a" stroke-width="7"/>
  <circle cx="1557" cy="228" r="27" fill="#dcebfc" stroke="#16243a" stroke-width="7"/>
  <circle cx="1467" cy="228" r="36" fill="#2f86f6" stroke="#16243a" stroke-width="7"/>

  <!-- ─────────── reward loop back to the memory corpus ─────────── -->
  <path d="M1546 404v56a28 28 0 0 1-28 28H168a28 28 0 0 1-28-28v-12"
        fill="none" stroke="url(#loop)" stroke-width="13" stroke-linecap="round"/>
  <path d="M120 468l20-24 20 24" fill="none" stroke="#2f86f6" stroke-width="13"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
