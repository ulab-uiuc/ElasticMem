# LongMemEval-MC10 — exact reproducible settings.

dataset:
  name: LongMemEval-MC10
  hf_repo:    Percena/lme-mc10
  rel_path:   data/lme_s_mc10.json
  num_choices: 10                       # MC (a)..(j)

split:
  splitter:    by_question_id
  split_mode:  random           # "random" (80/20 train/test) or "eval_only" (test=all 500)
  test_ratio:  0.2
  seed:        42

model:
  base_model:  "Qwen/Qwen2.5-3B-Instruct"   # or "Qwen/Qwen2.5-1.5B-Instruct"
  hidden_size: 2048
  torch_dtype: bfloat16

retrieval:
  chunker:           user_assistant_pair_per_session
  chunk_encoder:     reasoner_last_token
  query:             question_first_token_after
  top_z:             20
  n_tokens_min:      1
  n_tokens_max:      20
  max_hidden_cache:  20
  max_chunk_length:  2048
  cache_dir:         ./cache/chunk_embeddings_lme_mc10

prompt:
  instruction: |
    You MUST pick exactly one option from (a) to (j) — one of them is
    guaranteed to be correct. Do NOT say "not answerable", "I don't
    know", or refuse. If uncertain, make your best guess. Output exactly
    one token in the form (a), (b), (c), (d), (e), (f), (g), (h), (i),
    or (j).
  fields_order: [question, retrieval_gate, retrieved_chunks, instruction_plus_options, answer]

generation:
  max_new_tokens:   5
  train:
    temperature:    1.0
    top_p:          1.0
    num_generations: 4               # bump to 8 only if GPU memory allows
    sampling:       multinomial
  eval:
    temperature:    0.0
    sampling:       greedy

train:
  optimizer:        AdamW
  lr:               2.0e-5
  weight_decay:     0.0
  scheduler:        CosineAnnealingLR
  num_epochs:       5
  batch_size:       1
  grpo:
    num_generations: 4
    epsilon:        0.2
    policy_entropy_coef: 0.001
    num_grpo_iters: 1
  lora:
    r:              32
    alpha:          64
    dropout:        0.1
    target_modules: "q_proj,k_proj,v_proj,o_proj"

reward:
  type: letter_match_aj
  partial_credit: false

logging:
  results_dir:        ./results
  default_filename:   eval_test.json
  store_full_prompt:  true
