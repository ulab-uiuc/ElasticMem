# PersonaMem-128K — exact reproducible settings.

dataset:
  name: PersonaMem-128K
  question_path: ./data/questions_128k.csv
  context_path:  ./data/shared_contexts_128k.jsonl
  num_choices:   4

split:
  splitter: split_train_eval
  unit:     shared_context_id
  ratios:   {train: 0.8, val: 0.1, test: 0.1}
  seed:     42

model:
  base_model:   "Qwen/Qwen2.5-3B-Instruct"   # or "Qwen/Qwen2.5-1.5B-Instruct"
  hidden_size:  2048                          # 1536 if 1.5B
  torch_dtype:  bfloat16

retrieval:
  chunker:           user_assistant_pair
  chunk_encoder:     reasoner_last_token
  query:             question_first_token_after
  top_z:             9                        # ablations: 21 / 27 / 40
  n_tokens_min:      1
  n_tokens_max:      20
  max_hidden_cache:  20
  max_chunk_length:  2048
  cache_dir:         ./cache/chunk_embeddings_personamem_128k

prompt:
  instruction: |
    Answer with exactly one of the four options below, formatted as a
    single token like "(a)", "(b)", "(c)", or "(d)". Do not output any
    other text.
  fields_order: [question, retrieval_gate, retrieved_chunks, instruction_plus_options, answer]

generation:
  max_new_tokens:   5
  train:
    temperature:    1.0
    top_p:          1.0
    num_generations: 8
    sampling:       multinomial
  eval:
    temperature:    0.0
    sampling:       greedy

train:
  optimizer:        AdamW
  lr:               1.0e-4
  weight_decay:     0.0
  scheduler:        CosineAnnealingLR
  num_epochs:       10
  batch_size:       1
  grpo:
    num_generations: 8
    epsilon:        0.2
    policy_entropy_coef: 0.001
    num_grpo_iters: 1
  lora:
    r:              32
    alpha:          64
    dropout:        0.1
    target_modules: "q_proj,k_proj,v_proj,o_proj"

reward:
  type: letter_match_abcd
  partial_credit: false

logging:
  results_dir:        ./results
  default_filename:   eval_test.json
  store_full_prompt:  true
